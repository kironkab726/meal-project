  // 화면이 그려지기 전에 저장된 테마를 적용해서, 새로고침할 때 깜빡이지 않게 함
  (function () {

    try { theme = localStorage.getItem('menu-picker-theme'); } catch (e) {}

  /* ── 건의함 페이지 전용 (공통 스타일은 style.css) ── */

  .board { position: relative; z-index: 1; width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }

  .back-link { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--text); }
  .back-link .ico { width: 18px; height: 18px; }

  .board-title { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; line-height: 1.2; }
  .board-sub { margin: 2px 0 0; display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--muted); }
  .board-sub .ico { width: 16px; height: 16px; }

  .state-card { align-items: center; text-align: center; }
  .state-text { margin: 0; font-size: 17px; color: var(--muted); word-break: keep-all; }

  .request-form { display: flex; flex-direction: column; gap: 18px; }
  .field-label { padding: 0; font-family: 'Jua', sans-serif; font-size: 19px; }
  .menu-field { display: flex; flex-direction: column; gap: 6px; }
  .menu-field input { width: 100%; height: 54px; padding: 0 16px; font: inherit; font-size: 18px; color: var(--text); background: var(--bg); border: 2px solid var(--border); border-radius: 16px; }
  .menu-field input::placeholder { color: var(--muted); opacity: 0.8; }
  .menu-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-hint { font-size: 13px; color: var(--muted); }

  .meal-choice { min-width: 0; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px; }
  .meal-choice-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .meal-choice label { position: relative; cursor: pointer; }
  .meal-choice input { position: absolute; top: 50%; left: 50%; width: 1px; height: 1px; margin: 0; opacity: 0; }
  .meal-choice-btn { height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--border); border-radius: 16px; background: var(--paper); font-family: 'Jua', sans-serif; font-size: 19px; }
  .meal-choice label:hover .meal-choice-btn { border-color: var(--text); }
  .meal-choice input:checked + .meal-choice-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .meal-choice input:focus-visible + .meal-choice-btn { outline: 3px solid var(--accent); outline-offset: 2px; }

  .form-message { min-height: 1.4em; margin: -6px 0 0; font-family: 'Gaegu', cursive; font-weight: 700; font-size: 19px; line-height: 1.3; color: var(--quote); word-break: keep-all; }

  .requests { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .requests-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .requests h2 { margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 24px; }
  .requests-count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .requests-empty { margin: 12px 0; text-align: center; font-family: 'Gaegu', cursive; font-weight: 700; font-size: 21px; color: var(--quote); }

  .request-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .request-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 12px 10px 12px 14px; background: var(--paper); border: 2px solid var(--border-soft); border-radius: 18px; }
  .request-item.mine { border-color: var(--chip-on-border); }
  .request-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--photo-bg); color: var(--link); }
  .request-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .request-menu { font-family: 'Jua', sans-serif; font-size: 21px; line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .request-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .request-meta .tag { align-self: auto; }
  .mine-badge { padding: 1px 8px; border-radius: 999px; background: var(--chip-on-bg); color: var(--chip-on-text); font-size: 12px; font-weight: 700; }
  .delete-btn { width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 2px solid transparent; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
  .delete-btn:hover { border-color: var(--border); color: var(--text); }

  @media (min-width: 700px) {
    .board-title { font-size: 40px; }
    .requests { margin-top: 28px; }
    .requests h2 { font-size: 28px; }
    .request-item { padding: 14px 12px 14px 18px; border-radius: 22px; }
    .request-menu { font-size: 23px; }
  }
</style>

  const requestSubmitBtn = document.getElementById('request-submit');
  const formMessageEl = document.getElementById('form-message');
  const filtersEl = document.getElementById('request-filters');
  const listEl = document.getElementById('request-list');
  const emptyEl = document.getElementById('requests-empty');
  const countEl = document.getElementById('requests-count');

  let requests = [];     // 불러온 건의 글 (최신순)
  let filter = '전체';


  // ── 화면 상태: 안내 카드 ↔ 건의함 ────────────────────

  function showState(text, options) {
    const opts = options || {};
    stateTextEl.textContent = text;
    stateLoginBtn.hidden = !opts.login;
    heroBubbleEl.textContent = opts.bubble || DEFAULT_BUBBLE;
    stateCardEl.hidden = false;
    boardBodyEl.hidden = true;
  }

  function showBoard() {
    heroBubbleEl.textContent = DEFAULT_BUBBLE;
    stateCardEl.hidden = true;
    boardBodyEl.hidden = false;
  }

  stateLoginBtn.addEventListener('click', () => openAuth('로그인하면 메뉴 건의함에 들어갈 수 있어요냥.'));


  // ── 목록 ──────────────────────────────────────────────

  filtersEl.append(...['전체', ...MEAL_ORDER].map(name => {
    const b = document.createElement('button');
    b.type = 'button';
    if (MEAL_ICON[name]) b.append(icon(MEAL_ICON[name]));
    b.append(name);
    b.setAttribute('aria-pressed', name === filter);
    b.addEventListener('click', () => {
      filter = name;
      filtersEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      renderRequests();
    });
    return b;
  }));

  function requestItem(row) {
    const mine = Boolean(currentUser) && row.user_id === currentUser.id;
    const li = document.createElement('li');
    li.className = mine ? 'request-item mine' : 'request-item';

    const iconWrap = document.createElement('span');
    iconWrap.className = 'request-icon';
    iconWrap.append(icon(MEAL_ICON[row.meal] || 'bowl'));

    const meta = document.createElement('span');
    meta.className = 'request-meta';
    meta.append(textEl('span', 'tag', row.meal), textEl('span', '', timeAgo(row.created_at)));
    if (mine) meta.append(textEl('span', 'mine-badge', '내 건의'));

    const body = document.createElement('div');
    body.className = 'request-body';
    body.append(textEl('span', 'request-menu', row.menu_name), meta);

    li.append(iconWrap, body);

    if (mine) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.setAttribute('aria-label', `${row.menu_name} 건의 지우기`);
      del.title = '지우기';
      del.append(icon('trash'));
      del.addEventListener('click', () => deleteRequest(row));
      li.append(del);
    }
    return li;
  }

  function renderRequests() {
    const shown = filter === '전체' ? requests : requests.filter(r => r.meal === filter);
    listEl.replaceChildren(...shown.map(requestItem));
    countEl.textContent = requests.length ? `모두 ${requests.length}개` : '';
    emptyEl.hidden = shown.length > 0;
    emptyEl.textContent = requests.length
      ? `${filter} 건의는 아직 없다냥`
      : '아직 건의가 없다냥. 첫 번째로 적어 줘냥!';
  }

  async function loadRequests() {
    const uid = currentUser ? currentUser.id : null;
    const { data, error } = await db.from('menu_requests')
      .select('id, user_id, menu_name, meal, created_at')
      .order('created_at', { ascending: false })
      .limit(REQUEST_LIMIT);

    // 불러오는 사이에 로그아웃했거나 다른 계정으로 바뀌었으면 버림
    if ((currentUser ? currentUser.id : null) !== uid) return;

    if (error) {
      console.error(error);
      showState('건의함을 불러오지 못했어요. Supabase에 menu_requests 테이블을 만들었는지 확인해 주세요.');
      return;
    }
    requests = data;
    renderRequests();
  }

  async function deleteRequest(row) {
    if (!confirm(`"${row.menu_name}" 건의를 지울까요?`)) return;
    const { error } = await db.from('menu_requests').delete().eq('id', row.id).eq('user_id', currentUser.id);
    if (error) {
      console.error(error);
      alert('지우지 못했어요. 잠시 뒤 다시 시도해 주세요.');
      return;
    }
    requests = requests.filter(r => r.id !== row.id);
    renderRequests();
  }

  // "3분 전" 같은 시간 표시를 1분마다 새로 고침
  setInterval(() => { if (!boardBodyEl.hidden) renderRequests(); }, 60 * 1000);


  // ── 글쓰기 ────────────────────────────────────────────

  requestForm.addEventListener('submit', async e => {
    e.preventDefault();
    if (!currentUser) return openAuth('로그인하면 메뉴를 건의할 수 있어요냥.');

    const menuName = requestForm.elements.menu.value.trim().replace(/\s+/g, ' ');
    const mealValue = requestForm.elements.meal.value;
    if (!menuName) {
      formMessageEl.textContent = '메뉴 이름을 적어 주세요냥.';
      return;
    }
    if (!MEAL_ORDER.includes(mealValue)) {
      formMessageEl.textContent = '아침·점심·저녁 중에 하나를 골라 주세요냥.';
      return;
    }

    requestSubmitBtn.disabled = true;
    formMessageEl.textContent = '냥빵이에게 전하는 중…';

    const { data, error } = await db.from('menu_requests')
      .insert({ user_id: currentUser.id, menu_name: menuName, meal: mealValue })
      .select('id, user_id, menu_name, meal, created_at')
      .single();

    requestSubmitBtn.disabled = false;

    if (error) {
      console.error(error);
      formMessageEl.textContent = '건의를 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
      return;
    }

    requests = [data, ...requests].slice(0, REQUEST_LIMIT);
    renderRequests();
    requestForm.reset();
    formMessageEl.textContent = `"${data.menu_name}" 건의 고마워냥! ${data.meal} 메뉴로 참고할게냥.`;
    track('suggest_menu', { meal: data.meal, menu_name: data.menu_name });
  });


  // ── 시작: 로그인한 사람에게만 건의함을 보여줌 ─────────

  onUserChange(user => {
    if (user) {
      showBoard();
      listEl.replaceChildren();
      countEl.textContent = '';
      emptyEl.textContent = '건의를 불러오는 중이에요…';
      emptyEl.hidden = false;
      loadRequests();
    } else {
      requests = [];
      listEl.replaceChildren();
      requestForm.reset();
      formMessageEl.textContent = '';
      showState('로그인한 집사만 보고 쓸 수 있어요.', { login: true, bubble: '로그인한 집사만 들어올 수 있다냥!' });
    }
  });

  const problem = connectionProblem();
  showState(problem || '들어가도 되는지 확인하는 중이에요…');
</script>

</body>
</html>
